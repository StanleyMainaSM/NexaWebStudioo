name: Avelixa Build Verification

on:
  push:
    branches:
      - avelixa-current-work
  pull_request:
    branches:
      - avelixa-current-work

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Theme system regression tests
        run: node --experimental-strip-types tests/theme.test.mjs

      - name: Website creation foundation tests
        run: |
          node --experimental-strip-types tests/websiteCreationFoundation.test.mjs
          node --experimental-strip-types tests/websiteCreationSecurity.test.mjs
          node --experimental-strip-types tests/websiteCreationEditor.test.mjs
          node --experimental-strip-types tests/websiteCreationStudio.test.mjs
          node --experimental-strip-types tests/websiteCreationTemplates.test.mjs
          node --experimental-strip-types tests/websiteCreationProductIntegration.test.mjs
          npm run test:website-creation-generation
          npm run test:website-creation-preview
          npm run test:website-creation-output
          npm run test:website-creation-lifecycle
          npm run test:website-creation-artifact
          npm run test:website-creation-publishing
          npm run test:website-creation-public-delivery

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Existing application regression tests
        run: |
          npm run test:connector-notifications
          npm run test:connector-portal-routing
          npm run test:connector-activation
          node --experimental-strip-types tests/connectorActivationResend.test.mjs
          node --experimental-strip-types tests/ownerMemberLifecycle.test.mjs
          node --experimental-strip-types tests/portalAccessControl.test.mjs
          node --experimental-strip-types tests/portalAccessManagement.test.mjs
          npm run test:client-referrals
          npm run test:client-portal
          npm run test:invoice-notifications
          npm run test:payment-finance-handoff
          npm run test:client-payment-amount

      - name: Migration dependency regression tests
        id: migration_dependencies
        continue-on-error: true
        run: |
          set +e
          : > migration-dependency-test.log
          tests=(
            tests/adminAuthorizationMigrationDependency.test.mjs
            tests/communicationMigrationDependency.test.mjs
            tests/suitWearMigrationFreshDatabase.test.mjs
            tests/connectorProvisioningMigrationDependency.test.mjs
            tests/clientReferralMigrationDependency.test.mjs
            tests/automationMigrationDependency.test.mjs
            tests/notificationMigrationDependency.test.mjs
            tests/notificationEmailQueueMigrationDependency.test.mjs
          )
          status=0
          for test_file in "${tests[@]}"; do
            echo "===== $test_file =====" | tee -a migration-dependency-test.log
            node --experimental-strip-types "$test_file" 2>&1 | tee -a migration-dependency-test.log
            current=${PIPESTATUS[0]}
            if [ "$current" -ne 0 ]; then status=1; fi
          done
          {
            echo '## Migration dependency regression output'
            echo '```text'
            cat migration-dependency-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload migration dependency regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-dependency-regression-log
          path: migration-dependency-test.log
          if-no-files-found: error

      - name: Fail if migration dependency regression failed
        if: steps.migration_dependencies.outcome != 'success'
        run: exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database and apply all repository migrations
        run: supabase db reset --yes

      - name: Stage 3 portal access database regression
        id: stage3_db
        continue-on-error: true
        run: |
          set +e
          supabase test db supabase/tests/portal_access_management.test.sql 2>&1 | tee stage3-db-test.log
          status=${PIPESTATUS[0]}
          {
            echo '## Stage 3 database regression output'
            echo '```text'
            cat stage3-db-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload Stage 3 database regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-db-regression-log
          path: stage3-db-test.log
          if-no-files-found: error

      - name: Fail if Stage 3 database regression failed
        if: steps.stage3_db.outcome != 'success'
        run: exit 1

      - name: Run complete local database regression suite
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
