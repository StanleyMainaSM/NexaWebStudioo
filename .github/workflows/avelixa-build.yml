name: Avelixa Build Verification

# Stage 2 portal access verification is part of the standard build regression suite.
# Stage 4 Owner User Management gate regression is also part of this complete gate.
# This workflow intentionally runs the full local database reset and regression suite.
# The complete verification is required before a stage can be certified green.
# Retriggered once to avoid a transient local-Supabase runner stall.

on:
  push:
    branches:
      - avelixa-current-work
  pull_request:
    branches:
      - avelixa-current-work

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Theme system regression tests
        run: node --experimental-strip-types tests/theme.test.mjs

      - name: Stage 8 header responsive regression tests
        run: |
          node --experimental-strip-types tests/navResponsive.test.mjs
          node --experimental-strip-types tests/mobileNavigationCollision.test.mjs
          node --experimental-strip-types tests/globalNavigationRegression.test.mjs

      - name: Notification permission and push subscription regression tests
        run: node --experimental-strip-types tests/pushNotificationsPermission.test.mjs

      - name: Creation access password regression contract
        run: node --experimental-strip-types tests/creationAccessPassword.test.mjs

      - name: Package pricing synchronization tests
        run: node --experimental-strip-types tests/packagePricingSynchronization.test.mjs

      - name: Portal password management contract tests
        run: node --experimental-strip-types tests/portalAccessPasswordManagement.test.mjs

      - name: Stage 4 Owner User Management access-gate tests
        run: node --experimental-strip-types tests/ownerUserManagementAccessGate.test.mjs

      - name: Website creation foundation tests
        run: |
          node --experimental-strip-types tests/websiteCreationFoundation.test.mjs
          node --experimental-strip-types tests/websiteCreationSecurity.test.mjs
          node --experimental-strip-types tests/websiteCreationEditor.test.mjs
          node --experimental-strip-types tests/websiteCreationStudio.test.mjs
          node --experimental-strip-types tests/websiteCreationTemplates.test.mjs
          node --experimental-strip-types tests/websiteCreationProductIntegration.test.mjs
          npm run test:website-creation-generation
          npm run test:website-creation-preview
          npm run test:website-creation-output
          npm run test:website-creation-lifecycle
          npm run test:website-creation-artifact
          npm run test:website-creation-publishing
          npm run test:website-creation-public-delivery

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Favicon and metadata regression tests
        run: node --experimental-strip-types tests/faviconMetadata.test.mjs

      - name: Existing application regression tests
        run: |
          npm run test:connector-notifications
          npm run test:connector-portal-routing
          npm run test:connector-activation
          node --experimental-strip-types tests/connectorActivationResend.test.mjs
          node --experimental-strip-types tests/ownerMemberLifecycle.test.mjs
          node --experimental-strip-types tests/portalAccessControl.test.mjs
          npm run test:client-referrals
          npm run test:client-portal
          npm run test:invoice-notifications
          npm run test:payment-finance-handoff
          npm run test:client-payment-amount

      - name: Migration dependency regression tests
        run: |
          node --experimental-strip-types tests/adminAuthorizationMigrationDependency.test.mjs
          node --experimental-strip-types tests/communicationMigrationDependency.test.mjs
          node --experimental-strip-types tests/suitWearMigrationFreshDatabase.test.mjs
          node --experimental-strip-types tests/connectorProvisioningMigrationDependency.test.mjs
          node --experimental-strip-types tests/clientReferralMigrationDependency.test.mjs
          node --experimental-strip-types tests/automationMigrationDependency.test.mjs
          node --experimental-strip-types tests/notificationMigrationDependency.test.mjs
          node --experimental-strip-types tests/notificationEmailQueueMigrationDependency.test.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database and apply all repository migrations
        run: supabase db reset --yes

      - name: Run complete local database regression suite
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
