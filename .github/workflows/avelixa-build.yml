name: Avelixa Build Verification

on:
  push:
    branches:
      - avelixa-current-work
  pull_request:
    branches:
      - avelixa-current-work

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Initialize local Supabase configuration
        run: supabase init --force

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database and apply all repository migrations
        run: supabase db reset --yes

      - name: Run complete local database regression suite
        run: supabase test db

      - name: Connector notification tests
        run: npm run test:connector-notifications

      - name: Connector portal routing tests
        run: npm run test:connector-portal-routing

      - name: Client referral tests
        run: npm run test:client-referrals

      - name: Client portal lifecycle tests
        run: npm run test:client-portal

      - name: Invoice notification tests
        run: npm run test:invoice-notifications

      - name: Payment finance handoff tests
        run: npm run test:payment-finance-handoff

      - name: Client payment amount tests
        run: npm run test:client-payment-amount

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
