name: Temporary Connector URL Cleanup

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Replace legacy localhost invitation fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server.ts')
          text = path.read_text(encoding='utf-8-sig')

          legacy = '''const appUrl =
        process.env.APP_URL ||
        "http://localhost:3000";'''
          replacement = '''const appUrl = getCanonicalAppUrl();'''

          count = text.count(legacy)
          if count == 0:
              print('No legacy invitation URL blocks remain; nothing to change.')
              raise SystemExit(0)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 legacy invitation URL blocks, found {count}')

          text = text.replace(legacy, replacement)

          marker = '''const app = express();\nconst PORT = 3000;'''
          helper = '''function getCanonicalAppUrl() {\n  const configuredUrl =\n    process.env.APP_URL || process.env.VITE_APP_URL;\n\n  if (configuredUrl?.trim()) {\n    return configuredUrl.trim().replace(/\\/+$/, "");\n  }\n\n  if (process.env.NODE_ENV === "production") {\n    return "https://avelixa.co.ke";\n  }\n\n  throw new Error(\n    "Missing APP_URL. Configure APP_URL for server-side invitation links."\n  );\n}\n\nconst app = express();\nconst PORT = 3000;'''

          if text.count(marker) != 1:
              raise SystemExit('Could not find the server initialization marker exactly once')

          text = text.replace(marker, helper)
          path.write_text(text, encoding='utf-8')
          PY

          if grep -nE 'http://localhost:3000|127\.0\.0\.1' server.ts; then
            echo 'Legacy local URL remains in server.ts'
            exit 1
          fi

      - name: Commit canonical URL change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- server.ts; then
            echo 'No server.ts change required.'
            exit 0
          fi
          git add server.ts
          git diff --cached --check
          git commit -m "chore: apply canonical connector URL"
          git push origin HEAD:${{ github.head_ref }}
