name: Targeted Owner User Management Gate Fix

on:
  push:
    branches:
      - avelixa-current-work

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: avelixa-current-work

      - name: Remove obsolete portal access gate
        shell: python
        run: |
          from pathlib import Path

          path = Path("server.ts")
          source = path.read_text(encoding="utf-8")

          helper = '''async function hasOwnerPortalAccess(token: string) {
            const caller = createClient(supabaseUrl!, supabaseSecretKey!, {
              auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false },
              global: { headers: { Authorization: `Bearer ${token}` } },
            });
            const { data, error } = await caller.rpc('has_portal_access', { p_portal: 'owner' });
            if (error) {
              console.error('Owner User Management access-gate verification error:', error);
              return false;
            }
            return data === true;
          }

          '''

          gate = '''    if (!(await hasOwnerPortalAccess(token))) {
              return { user: null, error: "User Management access is locked. Re-enter the Owner access password." };
            }
'''

          if helper not in source and gate not in source:
              print("Obsolete Owner User Management access gate is already absent; nothing to change.")
              raise SystemExit(0)
          if source.count(helper) != 1:
              raise SystemExit(f"Expected exactly one obsolete access helper, found {source.count(helper)}")
          if source.count(gate) != 1:
              raise SystemExit(f"Expected exactly one obsolete access gate, found {source.count(gate)}")

          source = source.replace(helper, "", 1).replace(gate, "", 1)

          if "hasOwnerPortalAccess" in source or "User Management access is locked" in source:
              raise SystemExit("Obsolete Owner User Management access gate remains")

          path.write_text(source, encoding="utf-8")

      - name: Commit targeted server fix
        shell: bash
        run: |
          if git diff --quiet -- server.ts; then
            echo "No server.ts change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git diff --cached --check
          git diff --cached -- server.ts
          git commit -m "fix: remove obsolete owner user management access lock"
          git push origin avelixa-current-work
