# Stage 4 Owner User Management verification workflow.
name: Owner User Management
on:
  push:
    branches: [avelixa-current-work]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  owner-user-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 4 implementation
        run: |
          python3 scripts/stage4_patch.py
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A server.ts supabase/functions/avelixa-owner-member-status-prod/index.ts src/pages/portal/OwnerUserManagement.tsx scripts/stage4_patch.py
            git commit -m 'feat: enforce Owner User Management access gate'
            git push origin HEAD:avelixa-current-work
          fi
