# Stage 4 gate regression is part of the normal Owner User Management verification.
name: Owner User Management

on:
  push:
    branches:
      - avelixa-current-work
  workflow_dispatch:

jobs:
  owner-user-management:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Owner User Management regression tests
        run: node --experimental-strip-types --test tests/ownerMemberLifecycle.test.mjs tests/ownerUserManagementApi.test.mjs tests/ownerUserManagementCompletion.test.mjs tests/ownerUserManagementAccessGate.test.mjs

      - name: Vercel Express entrypoint runtime regression test
        run: node --experimental-strip-types tests/vercelExpressEntrypoint.test.mjs
