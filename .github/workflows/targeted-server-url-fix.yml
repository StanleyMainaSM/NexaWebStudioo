name: Apply targeted server invitation URL fix

on:
  push:
    branches:
      - avelixa-current-work

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the two unsafe invitation fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8-sig')
          pattern = r'process\.env\.APP_URL\s*\|\|\s*"http://localhost:3000"'
          matches = list(re.finditer(pattern, s))
          if len(matches) != 2:
              raise SystemExit(f'Expected exactly 2 targeted invitation fallbacks, found {len(matches)}')
          s2, count = re.subn(pattern, 'process.env.APP_URL', s)
          if count != 2 or re.search(pattern, s2):
              raise SystemExit('Targeted replacement verification failed')
          p.write_text(s2, encoding='utf-8')
          print('Replaced exactly 2 targeted invitation fallbacks.')
          PY
          git diff --check
          git diff -- server.ts
      - name: Commit targeted change
        shell: bash
        run: |
          git config user.name 'avelixa-maintenance'
          git config user.email 'avelixa-maintenance@users.noreply.github.com'
          git add server.ts
          git diff --cached --check
          git commit -m 'fix: remove localhost invitation fallback'
          git push