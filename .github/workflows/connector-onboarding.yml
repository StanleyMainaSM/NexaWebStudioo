name: Avelixa Connector Onboarding Verification

on:
  push:
    branches: [avelixa-current-work]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connector-onboarding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 4 implementation
        run: |
          python3 scripts/stage4_patch.py
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server.ts supabase/functions/avelixa-owner-member-status-prod/index.ts src/pages/portal/OwnerUserManagement.tsx scripts/stage4_patch.py .github/workflows/stage4-implementation-patch.yml .github/workflows/stage4-implementation-patch2.yml docs/.stage4-trigger
            git commit -m 'feat: enforce Owner User Management access gate'
            git push origin HEAD:avelixa-current-work
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Connector onboarding regression tests
        run: node --test tests/connectorApplicationsAccess.test.mjs tests/connectorOnboardingCompletion.test.mjs tests/connectorActivationLifecycle.test.mjs tests/connectorActivationResend.test.mjs tests/connectorPortalRouting.test.mjs tests/connectorProvisioningMigrationDependency.test.mjs tests/connectorNotifications.test.mjs tests/notificationEmailQueueMigrationDependency.test.mjs
