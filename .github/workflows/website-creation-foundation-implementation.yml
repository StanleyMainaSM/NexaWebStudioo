name: Implement and verify website creation foundation

on:
  push:
    branches: [avelixa-current-work]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: avelixa-current-work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Integrate routes and navigation
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          if "./pages/WebsiteCreationStudio" not in text:
              marker = "import { AuthProvider } from './lib/auth';"
              text = text.replace(marker, "import WebsiteCreationStudio from './pages/WebsiteCreationStudio'; import CreationOperatorAccess from './pages/portal/CreationOperatorAccess';\n" + marker)
          public_marker = '<Route path="/connector-apply" element={<PublicLayout><ConnectorApplication /></PublicLayout>} />'
          if 'path="/studio"' not in text:
              text = text.replace(public_marker, public_marker + ' <Route path="/studio" element={<PublicLayout><WebsiteCreationStudio /></PublicLayout>} />')
          portal_marker = '<Route path="messages" element={<CommunicationCenter />} />'
          if 'path="creation-studio"' not in text:
              text = text.replace(portal_marker, portal_marker + ' <Route path="creation-studio" element={<ProtectedRoute requiredRoles={[\'client\',\'connector\',\'admin\',\'owner\']}><WebsiteCreationStudio /></ProtectedRoute>} />')
          connector_marker = '<Route path="connector/applications" element={<ProtectedRoute requiredRoles={[\'owner\',\'admin\']}><ConnectorApplications /></ProtectedRoute>} />'
          if 'connector/leads/:leadId/creation' not in text:
              text = text.replace(connector_marker, connector_marker + ' <Route path="connector/leads/:leadId/creation" element={<ProtectedRoute requiredRoles={[\'connector\']} requiresConnectorTerms><WebsiteCreationStudio /></ProtectedRoute>} />')
          owner_marker = '<Route path="owner/users" element={<ProtectedRoute requiredRoles={[\'owner\']}><OwnerUserManagement /></ProtectedRoute>} />'
          if 'owner/creation-access' not in text:
              text = text.replace(owner_marker, owner_marker + ' <Route path="owner/creation-access" element={<ProtectedRoute requiredRoles={[\'owner\']}><CreationOperatorAccess /></ProtectedRoute>} />')
          operator_marker = '<Route path="operator" element={<ProtectedRoute requiredRoles={[\'operator\']}><OperatorDashboard /></ProtectedRoute>} />'
          if 'operator/creation/:creationProjectId' not in text:
              text = text.replace(operator_marker, operator_marker + ' <Route path="operator/creation/:creationProjectId" element={<ProtectedRoute requiredRoles={[\'operator\']}><WebsiteCreationStudio /></ProtectedRoute>} />')
          app.write_text(text)

          layout = Path('src/pages/portal/PortalLayout.tsx')
          text = layout.read_text()
          nav_marker = "{ name: 'Projects', path: '/portal/projects', icon: FolderKanban, roles: ['client', 'connector', 'operator', 'admin', 'owner'] },"
          nav_item = "{ name: 'Template Studio', path: '/portal/creation-studio', icon: Globe, roles: ['client', 'connector', 'operator', 'admin', 'owner'] },"
          if 'path: \'/portal/creation-studio\'' not in text:
              text = text.replace(nav_marker, nav_marker + nav_item)
          owner_marker = "{ name: 'User Management', path: '/portal/owner/users', icon: UserCog, roles: ['owner'] },"
          owner_item = "{ name: 'Creation Access', path: '/portal/owner/creation-access', icon: ShieldCheck, roles: ['owner'] },"
          if 'path: \'/portal/owner/creation-access\'' not in text:
              text = text.replace(owner_marker, owner_marker + owner_item)
          layout.write_text(text)

      - name: Add focused foundation tests
        shell: bash
        run: |
          cat > tests/websiteCreationFoundation.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { generateWebsiteSpecification, validateBusinessInformation } from '../src/lib/websiteCreation/generator.ts';
          import { templateSections } from '../src/lib/websiteCreation/templates.ts';

          const template = {
            id: 'template-1', slug: 'test', name: 'Test Template', description: 'Test', categories: ['business'],
            visual_style: 'test', sections: ['navbar','hero','about','services','contact','footer'],
            typography: { heading: 'sans', body: 'sans' }, color_direction: { primary: '#111827', accent: '#7c3aed', surface: '#fff' },
            layout: { container: 'wide' }, preview: {}, is_active: true, is_protected: true,
          };
          const business = { businessName: 'Acme Studio', industry: 'Design', services: ['Branding','Web'], products: [] };
          const specA = generateWebsiteSpecification(business, template, ['hero','services','contact'], true);
          const specB = generateWebsiteSpecification(business, template, ['hero','services','contact'], true);
          assert.deepEqual(specA, specB);
          assert.deepEqual(specA.sections, ['hero','services','contact']);
          assert.equal(specA.business.businessName, 'Acme Studio');
          assert.equal(specA.attribution.enabled, true);
          assert.deepEqual(templateSections(template, ['hero','pricing','contact']), ['hero','contact']);
          assert.ok(validateBusinessInformation({ businessName: '' }).length > 0);
          assert.ok(validateBusinessInformation({ businessName: 'Acme', email: 'bad' }).length > 0);
          assert.equal(validateBusinessInformation({ businessName: 'Acme', email: 'hello@example.com' }).length, 0);
          console.log('websiteCreationFoundation.test.mjs: PASS');
          EOF

          cat > tests/websiteCreationSecurity.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const migration = fs.readFileSync('supabase/migrations/20260831100000_website_creation_foundation.sql', 'utf8');
          const accessMigration = fs.readFileSync('supabase/migrations/20260831101000_website_creation_operator_access.sql', 'utf8');
          for (const table of ['website_templates','creation_projects','creation_generation_entitlements','creation_generation_usage']) assert.match(migration, new RegExp(`ALTER TABLE public\\.${table} ENABLE ROW LEVEL SECURITY`));
          assert.match(migration, /generation_count >= 0/);
          assert.match(migration, /generation_limit INTEGER NOT NULL DEFAULT 5/);
          assert.match(migration, /v_used >= v_limit/);
          assert.match(migration, /UPDATE public\.creation_generation_usage/);
          assert.match(migration, /is_active = true/);
          assert.match(migration, /client_id = auth\.uid\(\)/);
          assert.match(migration, /connector_id = auth\.uid\(\)/);
          assert.match(accessMigration, /can_generate BOOLEAN NOT NULL DEFAULT false/);
          assert.match(accessMigration, /Owner authorization required/);
          assert.match(accessMigration, /can_generate = true/);
          assert.match(accessMigration, /Target user must have Operator role/);
          console.log('websiteCreationSecurity.test.mjs: PASS');
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run foundation tests
        run: |
          node --experimental-strip-types tests/websiteCreationFoundation.test.mjs
          node --experimental-strip-types tests/websiteCreationSecurity.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run existing regression tests
        run: |
          npm run test:connector-leads
          npm run test:connector-earnings
          npm run test:connector-lifecycle
          npm run test:connector-notifications
          npm run test:connector-portal-routing
          npm run test:client-referrals
          npm run test:client-portal
          npm run test:invoice-notifications
          npm run test:payment-finance-handoff
          npm run test:client-payment-amount

      - name: Remove implementation workflow and commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/website-creation-foundation-implementation.yml
          git add .
          git status --short
          git commit -m "feat: implement template and website creation foundation" || true
          git push origin avelixa-current-work
