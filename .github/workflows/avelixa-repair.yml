name: Avelixa Repair Verification

on:
  push:
    branches:
      - avelixa-current-work
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic repairs
        shell: python
        run: |
          from pathlib import Path
          import re
          ROOT = Path('.')
          def remove_lucide(path, names):
              p = ROOT / path; text = p.read_text(encoding='utf-8')
              pattern = r"import\s*\{(?P<body>[^}]*)\}\s*from\s*['\"]lucide-react['\"];"
              def repl(m):
                  parts = [x.strip() for x in m.group('body').split(',') if x.strip()]
                  return "import { " + ", ".join(x for x in parts if x not in names) + " } from 'lucide-react';"
              p.write_text(re.sub(pattern, repl, text, count=1, flags=re.S), encoding='utf-8')

          (ROOT / 'src/pages/portal/CommunicationCenterV3.tsx').write_text("export { default } from './CommunicationCenterV4';\n", encoding='utf-8')
          (ROOT / 'src/pages/portal/MessagesV4.tsx').write_text("export { default } from './MessagesV6';\n", encoding='utf-8')
          (ROOT / 'src/pages/portal/MessagesV5.tsx').write_text("export { default } from './MessagesV6';\n", encoding='utf-8')
          remove_lucide('src/components/portal/CallOverlay.tsx', {'VideoOff'})
          remove_lucide('src/components/portal/CallOverlayV2.tsx', {'Video'})
          remove_lucide('src/pages/portal/CommunicationCenter.tsx', {'Wifi'})
          remove_lucide('src/pages/portal/CommunicationCenterV2.tsx', {'Volume2'})
          remove_lucide('src/pages/portal/CommunicationCenterV3.tsx', {'MessageSquare', 'Plus', 'UserPlus'})
          remove_lucide('src/pages/portal/CommunicationCenterV4.tsx', {'MessageSquare'})
          remove_lucide('src/pages/portal/MessagesV3.tsx', {'Clipboard', 'MessageCirclePlus'})
          remove_lucide('src/pages/portal/OwnerUserManagement.tsx', {'AlertTriangle', 'CheckCircle2', 'Trash2'})
          remove_lucide('src/pages/portal/Settings.tsx', {'Lock'})
          remove_lucide('src/pages/portal/WebsiteLinks.tsx', {'Globe2'})

          p = ROOT / 'src/components/portal/CallOverlay.tsx'; text = p.read_text(encoding='utf-8')
          old = "const subscription = await channel.subscribe();\n\n      if (subscription !== 'SUBSCRIBED') {\n        throw new Error('Avelixa could not connect the call signaling channel.');\n      }"
          new = "await new Promise<void>((resolve, reject) => {\n        channel.subscribe((status) => {\n          if (status === 'SUBSCRIBED') resolve();\n          else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') reject(new Error('Avelixa could not connect the call signaling channel.'));\n        });\n      });"
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = ROOT / 'src/components/portal/CallOverlayV2.tsx'; text = p.read_text(encoding='utf-8')
          text = text.replace("queued.current.push(s.payload.candidate);else if(pc.current)await pc.current.addIceCandidate(s.payload.candidate);", "queued.current.push((s.payload as Extract<SignalPayload,{kind:'ice'}>).candidate);else if(pc.current)await pc.current.addIceCandidate((s.payload as Extract<SignalPayload,{kind:'ice'}>).candidate);")
          text = text.replace("await p.setRemoteDescription(s.payload.description);", "await p.setRemoteDescription((s.payload as Extract<SignalPayload,{kind:'offer'}>).description);")
          text = text.replace("await pc.current.setRemoteDescription(s.payload.description);", "await pc.current.setRemoteDescription((s.payload as Extract<SignalPayload,{kind:'answer'}>).description);")
          p.write_text(text, encoding='utf-8')

          p = ROOT / 'src/lib/auth.tsx'; p.write_text(p.read_text(encoding='utf-8').replace("'@Supabase/supabase-js'", "'@supabase/supabase-js'"), encoding='utf-8')
          p = ROOT / 'src/vite-env.d.ts'; text = p.read_text(encoding='utf-8'); p.write_text(text if 'vite-plugin-pwa/client' in text else text + '/// <reference types="vite-plugin-pwa/client" />\n', encoding='utf-8')
          p = ROOT / 'src/pages/portal/Login.tsx'; p.write_text(p.read_text(encoding='utf-8').replace('window.navigator.standalone === true','(window.navigator as Navigator & { standalone?: boolean }).standalone === true'), encoding='utf-8')

          p = ROOT / 'src/pages/portal/dashboards/AdminProjects.tsx'; text = p.read_text(encoding='utf-8'); text = re.sub(r'\nfunction _?toDateTimeLocal\(value: string \| null\) \{.*?\n\}', '', text, count=1, flags=re.S); p.write_text(text.replace(': selectedProject?.operator_payment', ': selectedProject?.operator_payment ?? null'), encoding='utf-8')

          p = ROOT / 'src/pages/portal/MessagesV3.tsx'; text = p.read_text(encoding='utf-8'); text = text.replace('[selected,setSelected]=useState<string[]>([])', '[_selected,_setSelected]=useState<string[]>([])').replace("kind:'message',at:m.created_at,message:m", "kind:'message' as const,at:m.created_at,message:m").replace("kind:'call',at:c.created_at,call:c", "kind:'call' as const,at:c.created_at,call:c"); p.write_text(text, encoding='utf-8')

          p = ROOT / 'src/pages/portal/MessagesV6.tsx'; text = p.read_text(encoding='utf-8').replace('[lookupBusy,setLookupBusy]', '[lookupBusy,_setLookupBusy]')
          if '[incoming,setIncoming]' not in text:
              idx = text.find('const [addOpen,setAddOpen]=')
              if idx >= 0:
                  line_end = text.find('\n', idx); line_end = len(text) if line_end < 0 else line_end
                  text = text[:line_end] + "\n const [incoming,setIncoming]=useState<Call|null>(null);" + text[line_end:]
          p.write_text(text, encoding='utf-8')

          p = ROOT / 'src/pages/portal/SettingsV2.tsx'; text = p.read_text(encoding='utf-8')
          text = text.replace("const {data,error:e}=await supabase.from('profiles')", "const {data,error:profileError}=await supabase.from('profiles')")
          text = text.replace("if(e)throw e;if(!data)throw new Error('Your profile was not updated.", "if(profileError)throw profileError;if(!data)throw new Error('Your profile was not updated.")
          text = text.replace("const {data,e1:e2}=await supabase.from('profiles')", "const {data,error:e2}=await supabase.from('profiles')")
          text = text.replace("const {data,e}=await supabase.from('user_notification_preferences')", "const {data,error:prefsError}=await supabase.from('user_notification_preferences')")
          text = text.replace("if(e)throw e;setPrefs(data as Prefs)", "if(prefsError)throw prefsError;setPrefs(data as Prefs)")
          p.write_text(text, encoding='utf-8')

          p = ROOT / 'src/pages/portal/CommunicationCenterV2.tsx'; text = p.read_text(encoding='utf-8'); text = re.sub(r'\s+title="([^"]*)"', r' aria-label="\1"', text); text = re.sub(r'^\s*const unreadTotal = useMemo\(\(\) => Object\.values\(unreadByConversation\)\.reduce\(\(a, b\) => a \+ b, 0\), \[unreadByConversation\]\);\s*$', '', text, flags=re.M); p.write_text(text, encoding='utf-8')
          p = ROOT / 'src/sw.ts'; p.write_text(p.read_text(encoding='utf-8').replace('        renotify: true,\n', ''), encoding='utf-8')

      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit verified repairs and remove repair workflow
        run: |
          git config user.name "Avelixa Repair"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/avelixa-repair.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair typecheck and build regressions"
          git push origin HEAD:avelixa-current-work
