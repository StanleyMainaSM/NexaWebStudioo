name: Owner User Management Access-Lock Fix
on:
  push:
    branches: [avelixa-current-work]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply surgical server authentication edit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("server.ts")
          source = path.read_text()
          helper = '''async function hasOwnerPortalAccess(token: string) {
            const caller = createClient(supabaseUrl!, supabaseSecretKey!, {
              auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false },
              global: { headers: { Authorization: `Bearer ${token}` } },
            });
            const { data, error } = await caller.rpc('has_portal_access', { p_portal: 'owner' });
            if (error) {
              console.error('Owner User Management access-gate verification error:', error);
              return false;
            }
            return data === true;
          }

          '''
          legacy_block = '''    if (!(await hasOwnerPortalAccess(token))) {
                return { user: null, error: "User Management access is locked. Re-enter the Owner access password." };
              }
'''
          if source.count(helper) != 1:
            raise SystemExit(f"Expected exactly one obsolete helper, found {source.count(helper)}")
          if source.count(legacy_block) != 1:
            raise SystemExit(f"Expected exactly one obsolete access-lock block, found {source.count(legacy_block)}")
          source = source.replace(helper, "", 1).replace(legacy_block, "", 1)
          path.write_text(source)
          PY
      - name: Focused regression
        run: node --experimental-strip-types tests/ownerUserManagementAccessGate.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify surgical diff
        run: |
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "server.ts"
          if git diff -- server.ts | grep -E '^\\+.*(hasOwnerPortalAccess|has_portal_access|User Management access is locked)'; then exit 1; fi
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git rm .github/workflows/owner-user-management-access-lock-fix.yml
          git commit -m "fix: remove obsolete Owner User Management access lock"
          git push origin avelixa-current-work
