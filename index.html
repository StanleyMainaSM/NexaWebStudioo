<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#09090b" />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Avelixa"
    />

    <!-- Static fallback metadata.
         Route-specific metadata is managed by src/components/SEO.tsx. -->
    <title>Avelixa — Web Design & Development in Kenya</title>

    <meta
      name="description"
      content="Avelixa builds modern, high-converting websites for businesses in Kenya. Get a professional website designed to attract customers, build trust, and grow your business online."
    />

    <meta name="author" content="Avelixa" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://www.avelixa.co.ke/"
    />

    <!-- Avelixa current brand icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/pwa-192x192.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/pwa-192x192.png"
    />

    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
